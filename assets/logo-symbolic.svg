<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- The five-bar mark without its tile. Symbolic contexts (lock screen, tray,
       notification headers) recolour a single-colour glyph and cannot render a
       background, so a tiled icon gets desaturated into a grey block instead. -->
  <g fill="#bebebe">
    <rect x="1"  y="5" width="2" height="6"  rx="1"/>
    <rect x="4"  y="3" width="2" height="10" rx="1"/>
    <rect x="7"  y="1" width="2" height="14" rx="1"/>
    <rect x="10" y="3" width="2" height="10" rx="1"/>
    <rect x="13" y="5" width="2" height="6"  rx="1"/>
  </g>
</svg>
